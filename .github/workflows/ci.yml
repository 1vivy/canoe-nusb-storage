name: Storage contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.0
      - name: Cache Cargo compiler outputs and tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: storage-v1
          cache-workspace-crates: true
      - run: sudo apt-get update && sudo apt-get install -y dosfstools e2fsprogs
      - run: cargo test --workspace --locked
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Reuse generated WASM/glue without rebuilding for browser-harness edits.
      # Cargo caches below hold ordinary compiler outputs; test images live in
      # temporary directories or .work and are not part of those caches.
      - name: Reuse the locked production worker
        id: worker
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .work/browser-storage/pkg
          key: storage-wasm-v1-${{ runner.os }}-rust1.98.0-bindgen0.2.128-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '**/*.rs', '.cargo/**', 'rust-toolchain*', 'browser/build.sh') }}
      - if: steps.worker.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - name: Cache Cargo compiler outputs and tools
        if: steps.worker.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          prefix-key: storage-v1
          cache-workspace-crates: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Prepare browser and independent filesystem tools
        run: |
          sudo rm -f /etc/cron.daily/google-chrome /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y dosfstools e2fsprogs
          bun install --frozen-lockfile
          bunx --no-install playwright-core install --with-deps chromium
      - name: Build the locked production worker once
        if: steps.worker.outputs.cache-hit != 'true'
        run: |
          if [[ "$(wasm-bindgen --version 2>/dev/null || true)" != 'wasm-bindgen 0.2.128' ]]; then
            cargo install wasm-bindgen-cli --version 0.2.128 --locked
          fi
          bash browser/build.sh
      - name: Use current browser wrappers with the production worker
        run: cp browser/filesystem.js browser/filesystem-worker.js browser/filesystem.d.ts .work/browser-storage/
      - run: python3 qualification/filesystem-browser/prepare.py
      - run: bun qualification/managed-browser/run.ts
      - run: bun qualification/usb-errors/run.ts .work/browser-storage/pkg
      - run: bun qualification/filesystem-browser/run.ts
      - run: bun qualification/linux-oracle/run.ts .work/browser-storage
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-qualification-evidence
          path: |
            .work/browser-storage/*.json
            .work/browser-storage/results/*-oracle.log
            .work/linux-oracle/**/*.json
            .work/linux-oracle/**/*.log
          if-no-files-found: ignore
