<!doctype html>
<meta charset="utf-8">
<title>Browser filesystem feasibility lab</title>
<p>Disposable images and simulated asynchronous block I/O. No device writes.</p>
<pre id="output"></pre>
<script type="module">
import init, { granted_usb_devices } from './pkg/canoe_browser_probe.js';
const output = document.querySelector('#output');
window.runProbe = async (filesystem, fault = null) => {
  const image = new Uint8Array(await (await fetch(`${filesystem}.img`)).arrayBuffer());
  const payload = await (await fetch(filesystem === 'ext4' ? 'fat.img' : 'payload.bin')).arrayBuffer();
  const mailbox = new SharedArrayBuffer(16 + 1024 * 1024);
  const control = new Int32Array(mailbox, 0, 4);
  const bytes = new Uint8Array(mailbox, 16);
  const worker = new Worker('worker.js', { type: 'module' });
  const metrics = { read: 0, write: 0, flush: 0, readBytes: 0, writeBytes: 0, ticks: 0, maxTickGapMs: 0 };
  let lastTick = performance.now(), alive = true;
  const timer = setInterval(() => {
    const now = performance.now();
    metrics.ticks++;
    metrics.maxTickGapMs = Math.max(metrics.maxTickGapMs, now - lastTick);
    lastTick = now;
  }, 20);
  const start = performance.now();
  try {
    const result = await new Promise((resolve, reject) => {
      worker.onerror = event => reject(new Error(event.message));
      worker.onmessage = async ({ data }) => {
        if (data.kind === 'done') { resolve(data); return; }
        const { kind, offset, length } = data;
        metrics[kind]++;
        // An awaited asynchronous broker, never on the blocked worker's loop.
        // Regular delays make responsiveness and timeout probes observable.
        if ((metrics.read + metrics.write + metrics.flush) % 128 === 0)
          await new Promise(r => setTimeout(r, 2));
        else await Promise.resolve();
        if (!alive || fault === 'timeout') return;
        let status = 1, count = length;
        if (fault === 'disconnect' || (fault === 'flush' && kind === 'flush')) status = -1;
        else if (fault === 'short-read' && kind === 'read') count = Math.max(0, length - 1);
        else if (!['read', 'write', 'flush'].includes(kind) || !Number.isSafeInteger(offset)
            || offset < 0 || length > bytes.length || offset + length > image.length) status = -1;
        else if (kind === 'read') { bytes.set(image.subarray(offset, offset + length)); metrics.readBytes += length; }
        else if (kind === 'write') { image.set(bytes.subarray(0, length), offset); metrics.writeBytes += length; }
        Atomics.store(control, 1, count);
        Atomics.store(control, 0, status);
        Atomics.notify(control, 0);
      };
      worker.postMessage({ filesystem, length: image.length, payload, mailbox }, [payload]);
    });
    const report = { filesystem, fault, ...result, elapsedMs: performance.now() - start, metrics };
    if (result.ok && !fault) {
      const saved = await fetch(`/results/${filesystem}.img`, { method: 'PUT', body: image });
      if (!saved.ok) throw new Error('could not save result for independent verification');
    }
    output.textContent += JSON.stringify(report, null, 2) + '\n';
    return report;
  } finally { alive = false; clearInterval(timer); worker.terminate(); }
};
window.capabilities = async () => {
  await init();
  return {
    isolated: crossOriginIsolated, secure: isSecureContext,
    sharedArrayBuffer: typeof SharedArrayBuffer !== 'undefined',
    webusb: Boolean(navigator.usb),
    filePicker: typeof showSaveFilePicker === 'function',
    opfs: Boolean(navigator.storage?.getDirectory),
    grantedDevices: await granted_usb_devices(),
  };
};
</script>
